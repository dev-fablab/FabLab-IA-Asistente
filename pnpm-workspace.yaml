packages:
  - apps/*
  - packages/*
  - tests/*

# pnpm bloquea los scripts de instalación salvo los aprobados aquí.
allowBuilds:
  esbuild: true
  supabase: true
  unrs-resolver: true
  protobufjs: false

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.116'
  - '@ai-sdk/openai@4.0.96'
  - '@ai-sdk/provider-utils@5.0.62'
  - '@ai-sdk/provider@4.0.29'
  - ai@7.0.143
  - '@ai-sdk/mcp@2.0.78'
  - '@ai-sdk/react@4.0.147'
